services:
  capi:
    build: .
    ports:
      - "3210:3210"
    environment:
      CAPI_ADDR: ":3210"
      CAPI_DATA_DIR: /app/data
      CAPI_DB_PATH: /app/data/capi.sqlite
      CAPI_FILES_DIR: /app/data/files
    volumes:
      - capi-data:/app/data
    healthcheck:
      test: ["CMD", "/app/capi", "doctor"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  capi-data:
