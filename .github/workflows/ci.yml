name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        run: npm --prefix web ci && npm --prefix web run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Resolve modules
        run: go mod tidy
      - name: Format
        run: gofmt -w .
      - name: Vet
        run: go vet -tags webui_dist ./...
      - name: Test
        run: go test -tags webui_dist ./...
      - name: Build
        run: go build -tags webui_dist ./cmd/capi
